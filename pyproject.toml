[project]
name = "prusaslicer-mcp"
version = "0.1.0"
description = "Unofficial MCP server for PrusaSlicer (CLI engine now, live GUI bridge next)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Jorge Albareda" }]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "anyio>=4",
]

[project.scripts]
prusaslicer-mcp = "prusaslicer_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prusaslicer_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slicer: requires a real PrusaSlicer 2.9 installation",
]
