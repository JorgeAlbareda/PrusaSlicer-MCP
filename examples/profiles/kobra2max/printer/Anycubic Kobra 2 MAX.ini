# Anycubic Kobra 2 MAX - Anycubic Kobra 2 MAX example profile for PrusaSlicer 2.9 (PrusaSlicer-MCP)
bed_shape = 0x0,430x0,430x430,0x430
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]
color_change_gcode = M600
cooling_tube_length = 5
cooling_tube_retraction = 91.5
default_filament_profile = Anycubic PLA @Kobra2MAX
default_print_profile = 0.20mm Standard @Kobra2MAX
deretract_speed = 0
end_gcode = {if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F600 ; Move print head up{endif}\nG1 X5 Y{print_bed_max[1]-10} F{travel_speed*60} ; home X axis\n{if max_layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+30, max_print_height)} F600 ; Move print head up{endif}\nM140 S0 ; turn off heatbed\nM104 S0 ; turn off temperature\nM107 ; turn off fan\nM84 X Y E ; disable motors
extra_loading_move = -2
extruder_clearance_height = 20
extruder_clearance_radius = 20
extruder_colour = #FFFF00
extruder_offset = 0x0
gcode_flavor = marlin
high_current_on_filament_swap = 0
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 10000
machine_max_acceleration_extruding = 10000
machine_max_acceleration_retracting = 10000
machine_max_acceleration_travel = 3000
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_acceleration_z = 3000
machine_max_feedrate_e = 100
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 16
machine_max_jerk_e = 15
machine_max_jerk_x = 15
machine_max_jerk_y = 15
machine_max_jerk_z = 15
machine_min_extruding_rate = 0
machine_min_travel_rate = 0
max_layer_height = 0.28
max_print_height = 500
min_layer_height = 0.08
nozzle_diameter = 0.4
parking_pos_retraction = 92
pause_print_gcode = M601
printer_model = KOBRA2MAX
printer_notes = Do not remove the following keywords! These keywords are used in the "compatible printer" condition of the print and filament profiles to link the particular print and filament profiles to this printer profile.\nPRINTER_VENDOR_ANYCUBIC\nPRINTER_MODEL_KOBRA2MAX
printer_technology = FFF
printer_variant = 0.4
printer_vendor = Anycubic
remaining_times = 0
retract_before_travel = 1
retract_before_wipe = 0%
retract_layer_change = 1
retract_length = 2.5
retract_length_toolchange = 1
retract_lift = 0
retract_lift_above = 0
retract_lift_below = 0
retract_restart_extra = 0
retract_restart_extra_toolchange = 0
retract_speed = 80
silent_mode = 0
single_extruder_multi_material = 0
start_gcode = G90 ; use absolute coordinates\nM83 ; extruder relative mode\nM140 S[first_layer_bed_temperature] ; set bed temp\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM104 S[first_layer_temperature] ; set extruder temp\nM109 S[first_layer_temperature] ; wait for extruder temp\nG28 ; move X/Y/Z to min endstops\nG1 Z0.28 ; lift nozzle a bit\nG92 E0\nG1 Y3 F2400 ; zero the extruded length\nG1 X180 E40 F500 ; Extrude 40mm of filament\nG92 E0 ; zero the extruded length again\nG1 E-0.2 F3000 ; Retract a little\nG1 X181 F4000 ; Quickly wipe away from filament line\nM117
thumbnails = 230x110
thumbnails_format = PNG
use_firmware_retraction = 0
use_relative_e_distances = 1
use_volumetric_e = 0
variable_layer_height = 1
wipe = 0
z_offset = 0
